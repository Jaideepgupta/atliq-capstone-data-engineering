name: dbt-ci

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: pip install dbt-databricks

      - name: Install dependencies
        run: dbt deps
        working-directory: dbt_project

      - name: Check Databricks secrets
        run: |
          test -n "$DATABRICKS_HOST" && echo "HOST is set" || echo "HOST is MISSING"
          test -n "$DATABRICKS_HTTP_PATH" && echo "HTTP_PATH is set" || echo "HTTP_PATH is MISSING"
          test -n "$DATABRICKS_TOKEN" && echo "TOKEN is set" || echo "TOKEN is MISSING"

      - name: Build and test dbt
        run: dbt build --target ci --profiles-dir .
        working-directory: dbt_project
