version: 2

models:

  - name: dim_customer
    description: "Customer dimension."
    columns:
      - name: customer_id
        description: "Unique customer identifier."
        tests:
          - not_null
          - unique

  - name: dim_product
    description: "Product dimension with supplier cost and unit margin."
    columns:
      - name: product_id
        description: "Unique product identifier."
        tests:
          - not_null
          - unique

  - name: dim_date
    description: "Calendar date dimension."
    columns:
      - name: date_day
        description: "Calendar date."
        tests:
          - not_null
          - unique

  - name: fact_sales
    description: "Sales fact at one row per order item."
    columns:

      - name: order_item_id
        description: "Unique order item identifier."
        tests:
          - not_null
          - unique

      - name: order_id
        description: "Order identifier."
        tests:
          - not_null

      - name: customer_id
        description: "Customer identifier."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id

      - name: product_id
        description: "Product identifier."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id

      - name: order_date
        description: "Order date."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

  - name: fact_marketing_spend
    description: "Marketing spend fact at one row per marketing spend record."
    columns:

      - name: spend_date
        description: "Date of marketing spend."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

      - name: channel
        description: "Marketing channel."

      - name: campaign
        description: "Marketing campaign."

      - name: spend_amount
        description: "Marketing spend amount."
        tests:
          - not_null

      - name: clicks
        description: "Number of clicks."